name: Deploy Supabase

# Puts the database tables and the server functions (AI, Stripe) on Supabase whenever
# something under supabase/ changes on main. Can also be started by hand under Actions.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: wwuxobiaosstrgbhlcyi
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under Settings -> Secrets and variables -> Actions (see docs/EINRICHTUNG.md)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Update the database
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy the server functions
        run: supabase functions deploy ai create-checkout customer-portal --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy the Stripe webhook
        # Stripe does not sign in to Supabase; the function checks Stripe's signature instead.
        run: supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
